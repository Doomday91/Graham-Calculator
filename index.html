<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Investing Analysetool — Graham Number</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #080c14;
  --panel-bg: rgba(12, 20, 36, 0.88);
  --panel-border: rgba(56, 189, 248, 0.14);
  --glass-bg: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.07);
  --accent: #38bdf8;
  --accent-dim: rgba(56,189,248,0.12);
  --accent-green: #34d399;
  --accent-green-dim: rgba(52,211,153,0.12);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-dim: #4a5568;
  --danger: #f87171;
  --warning: #fbbf24;
  --success: #34d399;
  --border: rgba(56,189,248,0.1);
  --border-subtle: rgba(255,255,255,0.06);
  --row-hover: rgba(56,189,248,0.04);
  --radius: 10px;
  --radius-sm: 6px;
}

html, body {
  width: 100%; min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  line-height: 1.5;
  overflow-x: hidden;
}

#bg {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

.version-badge {
  position: fixed; bottom: 14px; right: 16px; z-index: 200;
  font-size: 0.65rem; color: rgba(255,255,255,0.35);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  letter-spacing: 0.04em;
  pointer-events: none;
  user-select: none;
}

.api-badge {
  position: fixed; top: 14px; right: 16px; z-index: 200;
  display: flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: var(--text-dim);
  background: rgba(8,12,20,0.85);
  border: 1px solid var(--border-subtle);
  padding: 5px 12px; border-radius: 20px;
  backdrop-filter: blur(12px);
  letter-spacing: 0.02em;
}
.api-badge b { color: var(--accent); font-weight: 600; }

.app-wrapper {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 16px 48px;
}

/* ── HEADER ── */
.header {
  text-align: center; margin-bottom: 28px; width: 100%;
}
.header h1 {
  font-size: clamp(1.35rem, 3vw, 1.85rem);
  font-weight: 700; letter-spacing: -0.025em;
  color: var(--text-primary);
}
.header h1 span { color: var(--accent); }
.header p {
  margin-top: 6px; font-size: 0.83rem;
  color: var(--text-secondary);
}

/* ── PANEL ── */
.panel {
  width: 100%; max-width: 1120px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  backdrop-filter: blur(24px);
  padding: 30px 28px;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.025),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.section-label {
  font-size: 0.68rem; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: 14px;
}

/* ── STOCK ROWS ── */
.stocks-list { display: flex; flex-direction: column; gap: 9px; }

.stock-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 9px 12px;
  transition: border-color 0.2s, background 0.2s;
}
.stock-row:hover { border-color: rgba(56,189,248,0.18); }

.row-index {
  min-width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(56,189,248,0.08);
  border: 1px solid rgba(56,189,248,0.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 700; color: var(--accent);
  flex-shrink: 0;
}

.search-input {
  flex: 1 1 160px; min-width: 0;
  background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-primary);
  padding: 6px 10px; border-radius: var(--radius-sm);
  font-size: 0.82rem; outline: none;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: rgba(56,189,248,0.4); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 5px; padding: 6px 13px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: 0.79rem; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all 0.18s; outline: none; font-family: inherit;
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-search {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.25);
  color: var(--accent);
}
.btn-search:not(:disabled):hover { background: rgba(56,189,248,0.2); border-color: rgba(56,189,248,0.4); }
.btn-search.loading { opacity: 0.7; }

.stock-select {
  flex: 2 1 200px; min-width: 0; max-width: 420px;
  background: rgba(0,0,0,0.32);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-primary);
  padding: 6px 8px; border-radius: var(--radius-sm);
  font-size: 0.78rem; outline: none; cursor: pointer;
  transition: border-color 0.2s;
}
.stock-select:focus { border-color: rgba(56,189,248,0.4); }
.stock-select option { background: #0e1624; color: var(--text-primary); padding: 4px; }
.stock-select option:disabled { color: var(--text-dim); font-style: italic; }

.btn-remove {
  background: rgba(248,113,113,0.07);
  border-color: rgba(248,113,113,0.18);
  color: var(--danger); padding: 6px 10px;
}
.btn-remove:not(:disabled):hover { background: rgba(248,113,113,0.14); }

/* ── ADD BUTTON ── */
.add-row {
  display: flex; justify-content: center;
  margin-top: 12px;
}
.btn-add {
  background: transparent;
  border: 1px dashed rgba(56,189,248,0.25);
  color: var(--text-secondary);
  padding: 7px 28px; border-radius: var(--radius-sm);
  font-size: 0.8rem; cursor: pointer; font-family: inherit;
  transition: all 0.18s; outline: none;
}
.btn-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* ── ANALYZE ROW ── */
.action-row {
  display: flex; justify-content: flex-end; align-items: center;
  margin-top: 22px; padding-top: 18px;
  border-top: 1px solid var(--border-subtle);
  gap: 12px; flex-wrap: wrap;
}

.btn-analyze {
  background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
  border: none; color: #fff;
  padding: 10px 28px; border-radius: var(--radius-sm);
  font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 18px rgba(14,165,233,0.28);
  transition: all 0.2s; outline: none;
}
.btn-analyze:not(:disabled):hover {
  background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 100%);
  box-shadow: 0 6px 22px rgba(14,165,233,0.42);
  transform: translateY(-1px);
}
.btn-analyze:active { transform: translateY(0); }
.btn-analyze:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.btn-clear-cache {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-secondary);
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 0.78rem; cursor: pointer; font-family: inherit;
  transition: all 0.18s; outline: none;
}
.btn-clear-cache:hover { border-color: var(--text-secondary); color: var(--text-primary); }

/* ── STATUS / LOADER ── */
.progress-wrap {
  height: 3px; background: rgba(255,255,255,0.04);
  border-radius: 2px; margin-top: 14px; overflow: hidden;
  display: none;
}
.progress-wrap.active { display: block; }
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: slide 1.4s ease-in-out infinite;
}
@keyframes slide {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(300%); }
}

.status-line {
  margin-top: 10px; min-height: 18px;
  font-size: 0.78rem; text-align: center;
  color: var(--text-secondary);
}
.status-line.err { color: var(--danger); }

/* ── RESULTS SECTION ── */
.results-section { margin-top: 28px; }
.results-separator {
  border: none; border-top: 1px solid var(--border-subtle);
  margin-bottom: 20px;
}

/* ── TOOLBAR ── */
.results-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
}

.filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

.filter-btn {
  padding: 5px 14px; border-radius: 20px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-secondary); font-size: 0.76rem;
  cursor: pointer; transition: all 0.18s; font-family: inherit; outline: none;
}
.filter-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active {
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.4);
  color: var(--accent); font-weight: 600;
}
.filter-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.toolbar-right { display: flex; align-items: center; gap: 8px; }

.btn-download {
  background: var(--accent-green-dim);
  border: 1px solid rgba(52,211,153,0.25);
  color: var(--accent-green);
  padding: 5px 16px; border-radius: var(--radius-sm);
  font-size: 0.79rem; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: all 0.18s; outline: none;
}
.btn-download:not(:disabled):hover { background: rgba(52,211,153,0.18); }
.btn-download:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── TABLE ── */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

table {
  width: 100%; border-collapse: collapse;
  font-size: 0.83rem;
}

thead { background: rgba(56,189,248,0.05); }
thead th {
  padding: 11px 14px; text-align: left;
  font-size: 0.72rem; font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.07em;
  cursor: pointer; user-select: none; white-space: nowrap;
  border-bottom: 1px solid var(--border);
  transition: color 0.15s;
}
thead th:hover { color: var(--accent); }
thead th.sort-asc::after  { content: ' ▲'; font-size: 0.6em; color: var(--accent); }
thead th.sort-desc::after { content: ' ▼'; font-size: 0.6em; color: var(--accent); }
thead th[data-tooltip] { cursor: help; }
thead th.num { text-align: right; }

tbody tr {
  border-bottom: 1px solid rgba(56,189,248,0.045);
  transition: background 0.14s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }

tbody td {
  padding: 11px 14px;
  vertical-align: middle;
  color: var(--text-primary);
}
tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }

.td-company { font-weight: 600; }
.td-ticker {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 0.78rem; color: var(--accent);
}
.td-pct { font-weight: 600; }

.badge {
  display: inline-block; padding: 3px 11px; border-radius: 12px;
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
}
.badge-goedkoop  { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.28); }
.badge-redelijk  { background: rgba(251,191,36,0.1);  color: #fbbf24; border: 1px solid rgba(251,191,36,0.28); }
.badge-duur      { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.28); }
.badge-onbekend  { background: rgba(100,116,139,0.1); color: #64748b; border: 1px solid rgba(100,116,139,0.22); }

.no-data {
  text-align: center; padding: 36px 20px;
  color: var(--text-dim); font-size: 0.83rem;
}

/* ── RESPONSIVE — tablet ── */
@media (max-width: 768px) {
  .panel { padding: 22px 18px; }
  .api-badge { font-size: 0.68rem; padding: 4px 10px; }
}

/* ── RESPONSIVE — mobiel ── */
@media (max-width: 600px) {
  /* Badges */
  .version-badge { display: none; }
  .api-badge {
    top: auto; bottom: 12px; right: 12px;
    font-size: 0.63rem; padding: 4px 9px;
  }

  /* Wrapper */
  .app-wrapper { padding: 16px 10px 68px; }

  /* Header */
  .header { margin-bottom: 18px; }
  .header h1 { font-size: 1.2rem; }
  .header p  { font-size: 0.76rem; }

  /* Panel */
  .panel { padding: 14px 11px; border-radius: 14px; }

  /* ── Stock rows: 2-regel layout ── */
  .stock-row {
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 9px;
    align-items: center;
  }
  .row-index { display: none; }

  /* Regel 1: zoekbalk + knop */
  .search-input {
    flex: 1 1 calc(100% - 78px);
    min-width: 0;
    padding: 8px 10px;
    font-size: 0.84rem;
  }
  .btn-search {
    flex: 0 0 68px;
    padding: 8px 0;
    font-size: 0.8rem;
  }

  /* Regel 2: select + verwijder */
  .stock-select {
    flex: 1 1 calc(100% - 48px);
    max-width: none;
    padding: 8px 8px;
    font-size: 0.8rem;
  }
  .btn-remove {
    flex: 0 0 38px;
    padding: 8px 0;
    font-size: 0.88rem;
  }

  /* Toevoeg-knop */
  .btn-add { width: 100%; padding: 9px; }

  /* Actie-rij */
  .action-row {
    flex-direction: column-reverse;
    align-items: stretch;
    gap: 8px;
    margin-top: 16px;
    padding-top: 14px;
  }
  .btn-analyze {
    width: 100%;
    padding: 13px;
    font-size: 0.92rem;
  }
  .btn-clear-cache { text-align: center; padding: 9px; }

  /* ── Toolbar ── */
  .results-toolbar { flex-direction: column; gap: 8px; }

  /* Filter-knoppen horizontaal scrollbaar */
  .filter-group {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
    gap: 5px;
  }
  .filter-group::-webkit-scrollbar { display: none; }
  .filter-btn { white-space: nowrap; flex-shrink: 0; padding: 6px 14px; }

  .btn-download { width: 100%; padding: 8px; }

  /* ── Tabel: horizontaal scrollen, kolom 1 vastzetten ── */
  .table-wrap { border-radius: 8px; -webkit-overflow-scrolling: touch; }

  thead th {
    padding: 9px 11px;
    font-size: 0.63rem;
    white-space: nowrap;
  }
  tbody td {
    padding: 10px 11px;
    font-size: 0.79rem;
    white-space: nowrap;
  }

  /* Sticky eerste kolom (bedrijfsnaam) */
  thead th:first-child,
  tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    background: #0c1523;
    border-right: 1px solid rgba(56,189,248,0.12);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  thead th:first-child {
    background: #0d1828;
    z-index: 3;
  }
  tbody tr:hover td:first-child { background: #101e30; }

  /* Data-kolom verbergen op kleine schermen */
  thead th:last-child,
  tbody td:last-child { display: none; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="version-badge">V1.11</div>

<div class="api-badge">
  API laatste min: <b id="api-count">0</b> / 60
</div>

<div class="app-wrapper">
  <header class="header">
    <h1>Value Investing <span>Analysetool</span></h1>
    <p>Graham Number analyse — Finnhub primair, Financial Modeling Prep als fallback</p>
  </header>

  <main class="panel">
    <div class="section-label">Portfolio selectie</div>

    <div class="stocks-list" id="stocks-list"></div>

    <div class="add-row">
      <button class="btn-add" id="btn-add">+ Aandeel</button>
    </div>

    <div class="action-row">
      <button class="btn-clear-cache" id="btn-clear-cache" title="Wis gecachede koers- en fundamentals-data en haal opnieuw op">Wis cache</button>
      <button class="btn-analyze" id="btn-analyze">Analyseer portfolio</button>
    </div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status-line" id="status-line"></div>

    <div class="results-section" id="results-section" style="display:none">
      <hr class="results-separator">
      <div class="results-toolbar">
        <div class="filter-group" id="filter-group">
          <button class="filter-btn active" data-filter="alle"      disabled>Alle</button>
          <button class="filter-btn"        data-filter="goedkoop"  disabled>Goedkoop</button>
          <button class="filter-btn"        data-filter="redelijk"  disabled>Redelijk</button>
          <button class="filter-btn"        data-filter="duur"       disabled>Duur</button>
          <button class="filter-btn"        data-filter="onbekend"  disabled>Onbekend</button>
        </div>
        <div class="toolbar-right">
          <button class="btn-download" id="btn-download" disabled>↓ Download XML</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-col="name"      data-tooltip="Naam van het genoteerde bedrijf.">Bedrijf</th>
              <th data-col="usedSymbol" data-tooltip="Beurssymbool waarmee het aandeel is opgezocht. Kan afwijken als een fallback-ticker is gebruikt.">Ticker</th>
              <th data-col="price"    class="num" data-tooltip="Actuele beurskoers in de lokale valuta van de primaire notering.">Koers</th>
              <th data-col="eps"      class="num" data-tooltip="Winst per aandeel (Earnings Per Share) — netto jaarwinst gedeeld door het aantal uitstaande aandelen. Negatieve EPS levert geen Graham Number op.">EPS</th>
              <th data-col="bookValue" class="num" data-tooltip="Boekwaarde per aandeel — eigen vermogen gedeeld door het aantal aandelen. Geeft de boekhoudkundige waarde per aandeel. Negatieve boekwaarde levert geen Graham Number op.">Boekwaarde</th>
              <th data-col="graham"   class="num" data-tooltip="Graham Number — maximale faire waarde volgens Benjamin Graham: wortel(22,5 x EPS x Boekwaarde). Koers onder dit getal kan een koopkans zijn.">Graham</th>
              <th data-col="diff"     class="num" data-tooltip="Verschil tussen de Graham Number en de actuele koers. Positief = koers ligt onder de Graham Number (potentieel goedkoop). Negatief = koers ligt erboven (potentieel te duur).">%</th>
              <th data-col="label"    data-tooltip="Waardeoordeel op basis van het verschil: Goedkoop (meer dan +20%), Redelijk (binnen +/-20%), Duur (minder dan -20%).">Label</th>
              <th data-col="fiscalYear" data-tooltip="Databron en periode. TTM = Trailing Twelve Months. Annual = meest recente jaarrapport. FMP = data via Financial Modeling Prep fallback.">Data</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>

  { symbol: 'MSFT',    name: 'Microsoft Corporation',    exchange: 'NASDAQ',   currency: 'USD' },
  { symbol: 'ASML',    name: 'ASML Holding',             exchange: 'NASDAQ',   currency: 'USD' },
];

// Per ticker: een lijst van fallback-tickers om te proberen als de primaire mislukt.
// Zo werkt ASML ook als de NASDAQ-listing geen fundamentals heeft maar ASML.AS wel.
const TICKER_FALLBACKS = {
  'ASML':    ['ASML', 'ASML.AS'],
  'ASML.AS': ['ASML.AS', 'ASML'],
};

/* ══════════════════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════════════════ */
let rows         = [];   // { id, query, results[], selected }
let analysisData = [];
let sortCol      = null;
let sortDir      = 1;    // 1 = asc, -1 = desc
let activeFilter = 'alle';
let rowIdSeq     = 0;

/* ══════════════════════════════════════════════════════════════════════
   CACHE HELPERS
══════════════════════════════════════════════════════════════════════ */
function cacheGet(key, ttl) {
  try {
    const raw = localStorage.getItem(CACHE_NS + key);
    if (!raw) return null;
    const { ts, data } = JSON.parse(raw);
    if (Date.now() - ts > ttl) { localStorage.removeItem(CACHE_NS + key); return null; }
    return data;
  } catch { return null; }
}

function cacheSet(key, data) {
  try {
    localStorage.setItem(CACHE_NS + key, JSON.stringify({ ts: Date.now(), data }));
  } catch { /* quota */ }
}

/* ══════════════════════════════════════════════════════════════════════
   API USAGE COUNTER — rolling 60-seconden venster (Finnhub free = 60/min)
══════════════════════════════════════════════════════════════════════ */
function usageKey() {
  // Bewaard voor de unit test; geeft een stabiele dag-string terug
  const d = new Date();
  return [d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

function getUsage() {
  // Aantal API-calls in de laatste 60 seconden
  try {
    const arr = JSON.parse(localStorage.getItem(CACHE_NS + 'api_times') || '[]');
    const cutoff = Date.now() - 60 * 1000;
    return arr.filter(t => t > cutoff).length;
  } catch { return 0; }
}

function incUsage() {
  try {
    const arr = JSON.parse(localStorage.getItem(CACHE_NS + 'api_times') || '[]');
    const now = Date.now();
    arr.push(now);
    // Trim: bewaar alleen timestamps van de laatste 5 min (ruim voor het rolling window)
    const cutoff = now - 5 * 60 * 1000;
    const trimmed = arr.filter(t => t > cutoff);
    localStorage.setItem(CACHE_NS + 'api_times', JSON.stringify(trimmed));
  } catch { /* ignore quota */ }
  const el = document.getElementById('api-count');
  if (el) el.textContent = getUsage();
}

/* ══════════════════════════════════════════════════════════════════════
   API CALLS — Finnhub
══════════════════════════════════════════════════════════════════════ */

// Helper: gooi een error met HTTP-status, zodat callers het verschil kunnen zien
// tussen "geen data" en "geen toegang" (402/403 = plan-beperking, 429 = rate limit).
function makeApiError(message, status) {
  const err = new Error(message);
  err.httpStatus = status;
  return err;
}

// Filter: type-strings die we als "echt aandeel" beschouwen (geen warrants, units, etc.)
const EQUITY_TYPES = new Set(['Common Stock', 'ADR', 'GDR', 'Equity', '']);

async function apiSearch(query) {
  const cacheKey = 'search_' + query.toLowerCase().trim();
  const cached = cacheGet(cacheKey, TTL_SEARCH);
  if (cached) return cached;

  // Lokale matches uit DEFAULT_LIST (instant, geen API-call nodig)
  const q = query.toLowerCase();
  const localHits = DEFAULT_LIST.filter(s =>
    s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)
  );

  let apiResults = [];
  try {
    incUsage();
    const resp = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}&token=${API_KEY}`);
    console.log(`[Finnhub] search "${query}": status=${resp.status}`);
    if (resp.ok) {
      const json = await resp.json();
      const list = Array.isArray(json && json.result) ? json.result : [];
      apiResults = list
        .filter(r => r && r.symbol && (EQUITY_TYPES.has(r.type || '')))
        .map(r => ({
          symbol:   r.symbol,
          name:     r.description || r.displaySymbol || '',
          exchange: '',  // Finnhub search geeft dit niet — wordt later via profile gevuld
          currency: '',
        }));
    }
  } catch (e) {
    console.warn(`[Finnhub] search error:`, e.message);
  }

  // Merge: lokale defaults eerst (met exchange/currency), daarna API-resultaten
  const merged = [];
  const seen   = new Set();
  for (const s of localHits)   { if (!seen.has(s.symbol)) { seen.add(s.symbol); merged.push(s); } }
  for (const s of apiResults)  { if (!seen.has(s.symbol)) { seen.add(s.symbol); merged.push(s); } }

  const result = merged.slice(0, 30);
  if (result.length > 0) cacheSet(cacheKey, result);
  return result;
}

async function apiQuote(symbol) {
  const cacheKey = 'quote_' + symbol;
  const cached = cacheGet(cacheKey, TTL_DATA);
  if (cached && cached.c != null && cached.c > 0) {
    console.log(`[Finnhub] quote ${symbol}: cache hit (c=${cached.c})`);
    return cached;
  }

  incUsage();
  const resp = await fetch(`${API_BASE}/quote?symbol=${encodeURIComponent(symbol)}&token=${API_KEY}`);
  console.log(`[Finnhub] quote ${symbol}: status=${resp.status}`);
  if (!resp.ok) throw makeApiError(`quote ${resp.status}`, resp.status);
  const data = await resp.json();

  // Finnhub geeft { c: 0, h: 0, l: 0, o: 0, pc: 0, t: 0 } terug voor onbekende tickers
  if (!data || data.c == null || data.c === 0) {
    console.log(`[Finnhub] quote ${symbol}: lege response (waarschijnlijk geen data voor deze ticker)`);
    throw makeApiError(`Geen quote-data voor ${symbol}`, 404);
  }

  cacheSet(cacheKey, data);
  console.log(`[Finnhub] quote ${symbol}: c=${data.c}`);
  return data;
}

async function apiMetrics(symbol) {
  const cacheKey = 'metric_' + symbol;
  const cached = cacheGet(cacheKey, TTL_DATA);
  if (cached && cached.metric && Object.keys(cached.metric).length > 0) {
    console.log(`[Finnhub] metric ${symbol}: cache hit`);
    return cached;
  }

  incUsage();
  const resp = await fetch(`${API_BASE}/stock/metric?symbol=${encodeURIComponent(symbol)}&metric=all&token=${API_KEY}`);
  console.log(`[Finnhub] metric ${symbol}: status=${resp.status}`);
  if (!resp.ok) throw makeApiError(`metric ${resp.status}`, resp.status);
  const data = await resp.json();

  if (!data || !data.metric || Object.keys(data.metric).length === 0) {
    console.log(`[Finnhub] metric ${symbol}: lege response`);
    throw makeApiError(`Geen metric-data voor ${symbol}`, 404);
  }

  cacheSet(cacheKey, data);
  const m = data.metric;
  console.log(`[Finnhub] metric ${symbol}: eps=${m.epsAnnual ?? m.epsTTM}, bvps=${m.bookValuePerShareAnnual}`);
  return data;
}

async function apiProfile(symbol) {
  const cacheKey = 'profile_' + symbol;
  const cached = cacheGet(cacheKey, TTL_PROFILE);
  if (cached && cached.ticker) return cached;

  incUsage();
  const resp = await fetch(`${API_BASE}/stock/profile2?symbol=${encodeURIComponent(symbol)}&token=${API_KEY}`);
  console.log(`[Finnhub] profile ${symbol}: status=${resp.status}`);
  if (!resp.ok) return null;  // profile is optional — niet kritisch
  const data = await resp.json();
  if (data && data.ticker) {
    cacheSet(cacheKey, data);
    return data;
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════════
   API CALLS — Financial Modeling Prep (fallback)
══════════════════════════════════════════════════════════════════════ */
async function fmpQuote(symbol) {
  const cacheKey = 'fmp_quote_' + symbol;
  const cached = cacheGet(cacheKey, TTL_DATA);
  if (cached && cached.price > 0) {
    console.log(`[FMP] quote ${symbol}: cache hit (price=${cached.price})`);
    return cached;
  }

  incUsage();
  const resp = await fetch(`${FMP_BASE}/quote/${encodeURIComponent(symbol)}?apikey=${FMP_KEY}`);
  console.log(`[FMP] quote ${symbol}: status=${resp.status}`);
  if (!resp.ok) throw makeApiError(`FMP quote ${resp.status}`, resp.status);
  const arr = await resp.json();
  if (!Array.isArray(arr) || arr.length === 0 || !arr[0].price) {
    throw makeApiError(`Geen FMP quote voor ${symbol}`, 404);
  }
  const data = arr[0];
  cacheSet(cacheKey, data);
  console.log(`[FMP] quote ${symbol}: price=${data.price}, eps=${data.eps}`);
  return data;
}

async function fmpKeyMetrics(symbol) {
  const cacheKey = 'fmp_metric_' + symbol;
  const cached = cacheGet(cacheKey, TTL_DATA);
  if (cached) {
    console.log(`[FMP] metrics ${symbol}: cache hit`);
    return cached;
  }

  incUsage();
  const resp = await fetch(`${FMP_BASE}/key-metrics-ttm/${encodeURIComponent(symbol)}?apikey=${FMP_KEY}`);
  console.log(`[FMP] metrics ${symbol}: status=${resp.status}`);
  if (!resp.ok) throw makeApiError(`FMP metrics ${resp.status}`, resp.status);
  const arr = await resp.json();
  if (!Array.isArray(arr) || arr.length === 0) {
    throw makeApiError(`Geen FMP metrics voor ${symbol}`, 404);
  }
  const data = arr[0];
  cacheSet(cacheKey, data);
  console.log(`[FMP] metrics ${symbol}: bvps=${data.bookValuePerShareTTM}, eps=${data.netIncomePerShareTTM}`);
  return data;
}

// Wis alle gecachede koers-, metric- en profile-data (zoekresultaten blijven staan)
function clearDataCache() {
  let cleared = 0;
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith(CACHE_NS) &&
        (k.includes('quote_') || k.includes('metric_') || k.includes('profile_') || k.includes('fmp_'))) {
      localStorage.removeItem(k);
      cleared++;
    }
  }
  console.log(`[Cache] ${cleared} data-entries gewist.`);
  return cleared;
}

/* ══════════════════════════════════════════════════════════════════════
   CALCULATIONS
══════════════════════════════════════════════════════════════════════ */
function calcBookValue(equity, shares) {
  if (equity == null || shares == null || shares === 0) return null;
  return equity / shares;
}

function calcGraham(eps, bookValue) {
  if (eps == null || bookValue == null) return null;
  if (eps <= 0 || bookValue <= 0) return null;
  return Math.sqrt(22.5 * eps * bookValue);
}

function calcDiff(graham, price) {
  if (graham == null || price == null || price === 0) return null;
  return ((graham - price) / price) * 100;
}

function calcLabel(diff) {
  if (diff == null) return 'onbekend';
  if (diff > 20)   return 'goedkoop';
  if (diff < -20)  return 'duur';
  return 'redelijk';
}

/* ══════════════════════════════════════════════════════════════════════
   ROW MANAGEMENT
══════════════════════════════════════════════════════════════════════ */
function makeRow(preselect) {
  const row = {
    id:       ++rowIdSeq,
    query:    preselect ? (preselect.name || '') : '',
    results:  preselect ? [preselect] : [],
    selected: preselect || null,
  };
  rows.push(row);
  return row;
}

function removeRow(id) {
  if (rows.length <= 1) return;
  rows = rows.filter(r => r.id !== id);
  renderRows();
}

function getSelectedSymbols() {
  return new Set(rows.map(r => r.selected && r.selected.symbol).filter(Boolean));
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER ROWS
══════════════════════════════════════════════════════════════════════ */
function renderRows() {
  const container = document.getElementById('stocks-list');
  container.innerHTML = '';
  const allSelected = getSelectedSymbols();

  rows.forEach((row, idx) => {
    const div = document.createElement('div');
    div.className = 'stock-row';
    div.dataset.id = row.id;

    // Build option HTML
    let optionsHtml = '';
    if (row.results.length === 0) {
      optionsHtml = '<option value="">— selecteer een aandeel —</option>';
    } else {
      optionsHtml = row.results.map(s => {
        const isCurrent = row.selected && row.selected.symbol === s.symbol;
        const isUsedByOther = allSelected.has(s.symbol) && !isCurrent;
        const label = `${escHtml(s.symbol)} — ${escHtml(s.name)} — ${escHtml(s.exchange || '')} — ${escHtml(s.currency || '')}`;
        return `<option value="${escHtml(s.symbol)}"${isCurrent ? ' selected' : ''}${isUsedByOther ? ' disabled' : ''}>${label}</option>`;
      }).join('');
    }

    div.innerHTML = `
      <span class="row-index">${idx + 1}</span>
      <input class="search-input" type="text" placeholder="Zoek naam of ticker"
             value="${escHtml(row.query)}" autocomplete="off" spellcheck="false">
      <button class="btn btn-search">Zoek</button>
      <select class="stock-select">${optionsHtml}</select>
      <button class="btn btn-remove"${rows.length <= 1 ? ' disabled' : ''} title="Verwijder rij">✕</button>
    `;

    const input     = div.querySelector('.search-input');
    const searchBtn = div.querySelector('.btn-search');
    const select    = div.querySelector('.stock-select');
    const removeBtn = div.querySelector('.btn-remove');

    input.addEventListener('input', () => { row.query = input.value; });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); searchBtn.click(); }
    });

    searchBtn.addEventListener('click', async () => {
      const q = input.value.trim();
      if (!q) { setStatus('Voer een naam of ticker in om te zoeken.', false); return; }
      searchBtn.disabled = true;
      searchBtn.classList.add('loading');
      searchBtn.textContent = '…';
      try {
        const results = await apiSearch(q);
        row.results  = results;
        // Auto-select beste match: exacte ticker match boven, anders eerste resultaat.
        // Voorkomt dat het select visueel iets toont terwijl row.selected nog null is.
        if (results.length > 0) {
          const qUpper = q.toUpperCase();
          const exact  = results.find(r => r.symbol.toUpperCase() === qUpper);
          row.selected = exact || results[0];
        } else {
          row.selected = null;
        }
        renderRows();
        if (results.length === 0) {
          setStatus('Geen resultaten voor "' + q + '". Probeer een ticker (bijv. "SW" voor Smurfit WestRock).', false);
        } else {
          setStatus('');
        }
      } catch (err) {
        setStatus('Zoekfout: ' + err.message, true);
      } finally {
        searchBtn.disabled = false;
        searchBtn.classList.remove('loading');
        searchBtn.textContent = 'Zoek';
      }
    });

    select.addEventListener('change', () => {
      const sym  = select.value;
      const found = row.results.find(r => r.symbol === sym) || null;
      row.selected = found;
      renderRows();
    });

    removeBtn.addEventListener('click', () => removeRow(row.id));

    container.appendChild(div);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   ANALYSIS
══════════════════════════════════════════════════════════════════════ */
async function runAnalysis() {
  const toAnalyze = [];
  const seen = new Set();
  for (const row of rows) {
    if (row.selected && !seen.has(row.selected.symbol)) {
      seen.add(row.selected.symbol);
      toAnalyze.push(row.selected);
    }
  }
  if (toAnalyze.length === 0) {
    setStatus('Selecteer minimaal één aandeel om te analyseren.', true);
    return;
  }

  setLoading(true);
  setStatus('Marktdata ophalen via Financial Modeling Prep…');
  document.getElementById('btn-analyze').disabled = true;
  document.getElementById('results-section').style.display = 'none';
  setToolbarEnabled(false);

  try {
    // allSettled: één falende stock breekt de rest niet af
    const settled = await Promise.allSettled(toAnalyze.map(fetchStock));
    analysisData = settled.map((r, i) => {
      if (r.status === 'fulfilled') return r.value;
      // Fallback-rij als fetchStock zelf onverwacht crasht
      const s = toAnalyze[i];
      return {
        symbol: s.symbol, name: s.name, usedSymbol: s.symbol,
        exchange: s.exchange || '', currency: s.currency || '',
        price: null, eps: null, bookValue: null,
        graham: null, diff: null, label: 'onbekend', fiscalYear: null,
      };
    });
    renderTable();
    document.getElementById('results-section').style.display = 'block';
    setToolbarEnabled(true);
    setStatus(`Analyse gereed — ${analysisData.length} aandeel${analysisData.length !== 1 ? 'en' : ''} verwerkt.`);
  } catch (err) {
    setStatus('Onverwachte fout: ' + err.message, true);
  } finally {
    setLoading(false);
    document.getElementById('btn-analyze').disabled = false;
  }
}

// Probeer een API-functie voor meerdere tickers; retourneer eerste met bruikbare data.
// hasData bepaalt of een response als "geldig" geldt voor dit endpoint.
async function tryFetch(fetchFn, symbols, hasData) {
  let lastStatus = null;
  for (const sym of symbols) {
    try {
      const data = await fetchFn(sym);
      if (data != null && hasData(data)) return { data, sym, status: null };
    } catch (e) {
      if (e && e.httpStatus != null) lastStatus = e.httpStatus;
    }
  }
  return { data: null, sym: symbols[0], status: lastStatus };
}

async function fetchStock(stock) {
  const result = {
    symbol:      stock.symbol,
    name:        stock.name,
    usedSymbol:  stock.symbol,
    exchange:    stock.exchange || '',
    currency:    stock.currency || '',
    price:       null,
    eps:         null,
    bookValue:   null,
    graham:      null,
    diff:        null,
    label:       'onbekend',
    fiscalYear:  null,
    errorStatus: null,
    errorNote:   null,
  };

  // Haal fallback-tickers op; voor onbekende stocks is dat gewoon [symbol]
  const symbols = TICKER_FALLBACKS[stock.symbol] || [stock.symbol];

  // Drie endpoints parallel — Finnhub geeft fundamentals via één /stock/metric call,
  // dus i.p.v. income+balance hebben we nu quote + metric + (optioneel) profile.
  const [quoteRes, metricRes, profileRes] = await Promise.allSettled([
    tryFetch(apiQuote,   symbols, d => d.c != null && d.c > 0),
    tryFetch(apiMetrics, symbols, d => d && d.metric &&
      (d.metric.epsAnnual != null || d.metric.epsTTM != null ||
       d.metric.epsBasicExclExtraItemsAnnual != null || d.metric.epsBasicExclExtraItemsTTM != null)),
    tryFetch(apiProfile, symbols, d => d && d.ticker),
  ]);

  // Koers
  if (quoteRes.status === 'fulfilled' && quoteRes.value.data) {
    result.price      = quoteRes.value.data.c ?? null;
    result.usedSymbol = quoteRes.value.sym;
  }

  // EPS + boekwaarde direct uit Finnhub metric — geen handmatige berekening meer nodig
  if (metricRes.status === 'fulfilled' && metricRes.value.data) {
    const m = metricRes.value.data.metric || {};
    result.eps =
      m.epsTTM ?? m.epsBasicExclExtraItemsTTM ??
      m.epsAnnual ?? m.epsBasicExclExtraItemsAnnual ?? null;
    result.bookValue =
      m.bookValuePerShareAnnual ?? m.bookValuePerShareQuarterly ?? null;
    // Gebruik metric-symbol als usedSymbol als quote ontbrak
    if (result.price == null) result.usedSymbol = metricRes.value.sym;
    // Type-aanduiding voor de "Data"-kolom
    result.fiscalYear = (m.epsTTM != null || m.epsBasicExclExtraItemsTTM != null) ? 'TTM' : 'Annual';
  }

  // Profiel: vul exchange/currency aan als die nog leeg waren (uit zoekresultaat)
  if (profileRes.status === 'fulfilled' && profileRes.value.data) {
    const p = profileRes.value.data;
    if (!result.currency) result.currency = p.currency || '';
    if (!result.exchange) result.exchange = (p.exchange || '').split(' ')[0];  // korte naam
  }

  // FMP fallback: als Finnhub geen (volledige) data gaf, probeer FMP
  const needsFmp = (result.price == null || result.eps == null || result.bookValue == null)
                   && FMP_KEY !== 'JOUW_FMP_KEY_HIER';
  if (needsFmp) {
    try {
      const sym = result.usedSymbol;
      if (result.price == null || result.eps == null) {
        const fmpQ = await fmpQuote(sym);
        if (result.price == null) result.price = fmpQ.price ?? null;
        if (result.eps   == null) result.eps   = fmpQ.eps   ?? null;
      }
      if (result.bookValue == null) {
        const fmpM = await fmpKeyMetrics(sym);
        result.bookValue = fmpM.bookValuePerShareTTM ?? null;
        if (result.eps == null) result.eps = fmpM.netIncomePerShareTTM ?? null;
      }
      if (result.fiscalYear == null) result.fiscalYear = 'FMP TTM';
      else result.fiscalYear += '+FMP';
      console.log(`[FMP] fallback succesvol voor ${sym}: price=${result.price}, eps=${result.eps}, bvps=${result.bookValue}`);
    } catch (e) {
      console.warn(`[FMP] fallback mislukt voor ${result.usedSymbol}:`, e.message);
    }
  }

  result.graham = calcGraham(result.eps, result.bookValue);
  result.diff   = calcDiff(result.graham, result.price);
  result.label  = calcLabel(result.diff);

  // Verzamel HTTP-foutcodes en bouw een mensvriendelijke notitie
  const statuses = [
    quoteRes.status   === 'fulfilled' ? quoteRes.value.status   : null,
    metricRes.status  === 'fulfilled' ? metricRes.value.status  : null,
    profileRes.status === 'fulfilled' ? profileRes.value.status : null,
  ].filter(s => s != null);

  const allMissing = result.price == null && result.eps == null && result.bookValue == null;

  if (statuses.length > 0 && allMissing) {
    const has401 = statuses.includes(401);
    const has402 = statuses.includes(402);
    const has403 = statuses.includes(403);
    const has404 = statuses.includes(404);
    const has429 = statuses.includes(429);
    if      (has401)            result.errorNote = `Ongeldige API-key (401)`;
    else if (has402 || has403)  result.errorNote = `Finnhub-plan vereist (HTTP ${has402 ? 402 : 403})`;
    else if (has429)            result.errorNote = `Rate limit (HTTP 429) — wacht 1 min`;
    else if (has404)            result.errorNote = `Ticker niet gevonden`;
    else                        result.errorNote = `HTTP ${statuses[0]}`;
    result.errorStatus = statuses[0];
  } else if (statuses.length > 0) {
    result.errorNote = `Gedeeltelijk (HTTP ${statuses.join('/')})`;
    result.errorStatus = statuses[0];
  }

  return result;
}

/* ══════════════════════════════════════════════════════════════════════
   TABLE RENDER
══════════════════════════════════════════════════════════════════════ */
function renderTable() {
  let data = activeFilter === 'alle'
    ? [...analysisData]
    : analysisData.filter(d => d.label === activeFilter);

  if (sortCol) {
    data.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (va == null) va = sortDir === 1 ? Infinity : -Infinity;
      if (vb == null) vb = sortDir === 1 ? Infinity : -Infinity;
      if (typeof va === 'string') return sortDir * va.localeCompare(vb, 'nl');
      return sortDir * (va - vb);
    });
  }

  const tbody = document.getElementById('results-body');
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" class="no-data">Geen aandelen voor dit filter.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(d => {
    const cur = d.currency ? d.currency + ' ' : '';
    const n   = (v, dec = 2) =>
      v != null ? Number(v).toLocaleString('nl-NL', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : '—';
    const pct = v =>
      v != null ? (v > 0 ? '+' : '') + Number(v).toLocaleString('nl-NL', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%' : '—';
    const pctColor =
      d.diff != null
        ? d.diff > 20 ? '#34d399' : d.diff < -20 ? '#f87171' : '#fbbf24'
        : 'inherit';
    const badgeClass = {
      goedkoop: 'badge-goedkoop',
      redelijk: 'badge-redelijk',
      duur:     'badge-duur',
      onbekend: 'badge-onbekend',
    }[d.label] || 'badge-onbekend';

    return `<tr>
      <td class="td-company">${escHtml(d.name)}</td>
      <td class="td-ticker">${escHtml(d.usedSymbol)}</td>
      <td class="num">${d.price != null ? cur + n(d.price) : '—'}</td>
      <td class="num">${d.eps   != null ? n(d.eps) : '—'}</td>
      <td class="num">${d.bookValue != null ? n(d.bookValue) : '—'}</td>
      <td class="num">${d.graham != null ? cur + n(d.graham) : '—'}</td>
      <td class="num td-pct" style="color:${pctColor}">${pct(d.diff)}</td>
      <td><span class="badge ${badgeClass}">${escHtml(d.label)}</span></td>
      <td style="color:var(--text-secondary);font-size:0.78rem" title="${escHtml(d.errorNote || '')}">
        ${d.errorNote
          ? `<span style="color:#fbbf24">⚠ ${escHtml(d.errorNote)}</span>`
          : escHtml(d.fiscalYear || '—')}
      </td>
    </tr>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════════════════════
   SORTING
══════════════════════════════════════════════════════════════════════ */
function initSorting() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) { sortDir *= -1; }
      else { sortCol = col; sortDir = 1; }
      document.querySelectorAll('thead th').forEach(h => h.classList.remove('sort-asc','sort-desc'));
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
      renderTable();
    });
  });
}

/* ══════════════════════════════════════════════════════════════════════
   FILTER
══════════════════════════════════════════════════════════════════════ */
function initFilter() {
  document.getElementById('filter-group').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn || btn.disabled) return;
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  });
}

function setToolbarEnabled(on) {
  document.querySelectorAll('.filter-btn').forEach(b => { b.disabled = !on; });
  document.getElementById('btn-download').disabled = !on;
}

/* ══════════════════════════════════════════════════════════════════════
   XML DOWNLOAD
══════════════════════════════════════════════════════════════════════ */
function escXml(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&apos;');
}

function downloadXml() {
  const iso  = new Date().toISOString();
  const fmt4 = v => (v != null ? Number(v).toFixed(4) : '');

  const nodes = analysisData.map(d => `  <stock>
    <symbol>${escXml(d.symbol)}</symbol>
    <name>${escXml(d.name)}</name>
    <usedSymbol>${escXml(d.usedSymbol)}</usedSymbol>
    <price>${fmt4(d.price)}</price>
    <eps>${fmt4(d.eps)}</eps>
    <bookValuePerShare>${fmt4(d.bookValue)}</bookValuePerShare>
    <grahamNumber>${fmt4(d.graham)}</grahamNumber>
    <differencePercent>${fmt4(d.diff)}</differencePercent>
    <label>${escXml(d.label)}</label>
    <fiscalYear>${escXml(d.fiscalYear)}</fiscalYear>
  </stock>`).join('\n');

  const xml  = `<?xml version="1.0" encoding="UTF-8"?>\n<stockAnalysis generatedAt="${escXml(iso)}">\n${nodes}\n</stockAnalysis>`;
  const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'stock-analysis.xml';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ══════════════════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════════════════ */
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function setStatus(msg, isError) {
  const el = document.getElementById('status-line');
  el.textContent = msg || '';
  el.className   = 'status-line' + (isError ? ' err' : '');
}

function setLoading(on) {
  document.getElementById('progress-wrap').classList.toggle('active', on);
}

/* ══════════════════════════════════════════════════════════════════════
   CANVAS BACKGROUND
══════════════════════════════════════════════════════════════════════ */
function initCanvas() {
  const canvas = document.getElementById('bg');
  const ctx    = canvas.getContext('2d');
  let   blobs  = [];

  const BLOB_COUNT = 8;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function mkBlob() {
    return {
      x:     Math.random() * canvas.width,
      y:     Math.random() * canvas.height,
      r:     160 + Math.random() * 260,
      vx:    (Math.random() - 0.5) * 0.28,
      vy:    (Math.random() - 0.5) * 0.28,
      hue:   Math.random() < 0.55 ? 195 + Math.random() * 30 : 155 + Math.random() * 25,
      alpha: 0.035 + Math.random() * 0.055,
    };
  }

  function initBlobs() {
    blobs = Array.from({ length: BLOB_COUNT }, mkBlob);
    console.log('[TEST] Achtergrondobjecten geïnitialiseerd:', blobs.length);
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Base gradient
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#060a12');
    bg.addColorStop(1, '#09101e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (const b of blobs) {
      b.x += b.vx;
      b.y += b.vy;
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W+b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      if (b.y > H+b.r) b.y = -b.r;

      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0,   `hsla(${b.hue}, 75%, 52%, ${b.alpha})`);
      g.addColorStop(0.5, `hsla(${b.hue}, 70%, 42%, ${b.alpha * 0.5})`);
      g.addColorStop(1,   `hsla(${b.hue}, 65%, 35%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  initBlobs();
  draw();
}

/* ══════════════════════════════════════════════════════════════════════
   COLUMN TOOLTIPS
══════════════════════════════════════════════════════════════════════ */
function initTooltips() {
  const tip = document.createElement('div');
  Object.assign(tip.style, {
    position: 'fixed', display: 'none', zIndex: '500',
    background: '#0d1726', border: '1px solid rgba(56,189,248,0.3)',
    color: '#e2e8f0', fontSize: '0.74rem', lineHeight: '1.55',
    padding: '9px 13px', borderRadius: '8px', maxWidth: '260px',
    boxShadow: '0 8px 28px rgba(0,0,0,0.65)', pointerEvents: 'none',
    whiteSpace: 'normal',
  });
  document.body.appendChild(tip);

  function position(e) {
    const x = e.clientX + 14;
    const y = e.clientY + 18;
    tip.style.left = Math.min(x, window.innerWidth  - 274) + 'px';
    tip.style.top  = Math.min(y, window.innerHeight - 100) + 'px';
  }

  document.querySelectorAll('thead th[data-tooltip]').forEach(th => {
    th.addEventListener('mouseenter', e => {
      tip.textContent = th.dataset.tooltip;
      tip.style.display = 'block';
      position(e);
    });
    th.addEventListener('mousemove', position);
    th.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

/* ══════════════════════════════════════════════════════════════════════
   CONSOLE TESTS
══════════════════════════════════════════════════════════════════════ */
function runTests() {
  const pass = (label) => console.log(`%c✓ ${label}`, 'color:#34d399');
  const fail = (label) => console.error(`✗ FAIL: ${label}`);

  console.group('Value Investing Analysetool — Unit Tests');

  // 1. Boekwaardeberekening
  const bv = calcBookValue(10000, 500);
  Math.abs(bv - 20) < 0.001 ? pass('Boekwaarde: 10000/500 = 20') : fail('Boekwaardeberekening');

  // 2. Deling door nul
  calcBookValue(100, 0) === null ? pass('Deling door nul → null') : fail('Deling door nul');

  // 3. Ontbrekende equity → null
  calcBookValue(null, 500) === null ? pass('Ontbrekende equity → null') : fail('Ontbrekende equity');

  // 4. Graham Number
  const g = calcGraham(2.5, 30);
  const exp = Math.sqrt(22.5 * 2.5 * 30);
  Math.abs(g - exp) < 0.001 ? pass(`Graham (eps=2.5, bv=30) = ${g.toFixed(4)}`) : fail('Graham Number');

  // 5. Verschilberekening
  const d = calcDiff(130, 100);
  Math.abs(d - 30) < 0.001 ? pass(`Verschil (graham=130, price=100) = +${d.toFixed(1)}%`) : fail('Verschilberekening');

  // 6. Labels
  calcLabel(25)   === 'goedkoop' ? pass('Label >20% → goedkoop')  : fail('Label goedkoop');
  calcLabel(-25)  === 'duur'     ? pass('Label <-20% → duur')      : fail('Label duur');
  calcLabel(5)    === 'redelijk' ? pass('Label 5% → redelijk')     : fail('Label redelijk');
  calcLabel(null) === 'onbekend' ? pass('Label null → onbekend')   : fail('Label onbekend');

  // 7. Geldige ticker
  const valid = DEFAULT_LIST.find(s => s.symbol === 'AAPL');
  valid ? pass('Geldige ticker AAPL → ' + valid.name) : fail('Geldige ticker');

  // 8. Ongeldige ticker
  const invalid = DEFAULT_LIST.find(s => s.symbol === 'XYZ_INVALID_999');
  invalid == null ? pass('Ongeldige ticker → undefined') : fail('Ongeldige ticker');

  // 9. Negatieve EPS geeft geen Graham
  calcGraham(-1, 30) === null ? pass('Negatieve EPS → Graham = null') : fail('Negatieve EPS');

  // 10. Nul boekwaarde geeft geen Graham
  calcGraham(2.5, 0) === null ? pass('Nul boekwaarde → Graham = null') : fail('Nul boekwaarde');

  // 11. Datumkey voor API-usage
  const dk = usageKey();
  /^\d{4}-\d{2}-\d{2}$/.test(dk) ? pass('Datumkey formaat: ' + dk) : fail('Datumkey formaat');

  // 12. API-usage object
  const cnt = getUsage();
  typeof cnt === 'number' ? pass('API-usage object geldig: ' + cnt) : fail('API-usage object');

  console.groupEnd();
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════════════════ */
function init() {
  initCanvas();

  document.getElementById('api-count').textContent = getUsage();

  // Initial 3 rows
  for (const sel of INITIAL_SELECTIONS) makeRow(sel);
  renderRows();

  document.getElementById('btn-add').addEventListener('click', () => {
    if (rows.length >= 25) return;
    makeRow(null);
    renderRows();
    // Focus the new row's search input
    const inputs = document.querySelectorAll('.search-input');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  document.getElementById('btn-analyze').addEventListener('click', runAnalysis);
  document.getElementById('btn-download').addEventListener('click', downloadXml);
  document.getElementById('btn-clear-cache').addEventListener('click', () => {
    const n = clearDataCache();
    setStatus(`Cache gewist (${n} entries). Klik "Analyseer portfolio" om opnieuw op te halen.`);
  });

  initSorting();
  initFilter();
  initTooltips();

  // Run tests after a tick so canvas init message appears first
  setTimeout(runTests, 150);
}

document.addEventListener('DOMContentLoaded', init);
